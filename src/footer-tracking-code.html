<script>
(function () {
  const WEBHOOK_URL = "https://connect.pabbly.com/workflow/sendwebhookdata/IjU3NjcwNTZmMDYzMDA0Mzc1MjZjNTUzZDUxMzEi_pc";
  
  let alreadySubmitted = false;
  const SIMPLE_PRODUCTION_RATE_PER_KWH = 0.12;

  function el(id) {
    return document.getElementById(id);
  }

  function show(id, shouldShow) {
    const node = el(id);
    if (!node) return;
    node.style.display = shouldShow ? "block" : "none";
  }
  
  function setSectionDisabled(sectionId, disabled) {
    const section = el(sectionId);
    if (!section) return;

    if (disabled) {
      section.classList.add("disabled-section");
    } else {
      section.classList.remove("disabled-section");
    }

    const fields = section.querySelectorAll("input, select, textarea");
    fields.forEach(field => {
      field.disabled = disabled;
    });
  }

  function money(x) {
    const n = Number(x || 0);
    return "$" + n.toLocaleString(undefined, { maximumFractionDigits: 2 });
    
    return n < 0 ? "-$" + formatted : "$" + formatted;
  }

  function num(id) {
    const node = el(id);
    if (!node) return 0;
    const raw = (node.value || "").toString().trim();
    if (!raw) return 0;
    const parsed = parseFloat(raw.replace(/[^0-9.\-]/g, ""));
    return isNaN(parsed) ? 0 : parsed;
  }

  function val(id) {
    const node = el(id);
    if (!node) return "";
    if (node.type === "checkbox") return node.checked ? "yes" : "no";
    return (node.value || "").toString().trim();
  }

  function checked(id) {
    const node = el(id);
    return !!(node && node.checked);
  }
  
  function noteHasValue(value) {
    return value !== undefined && value !== null && String(value).trim() !== "";
  }

  function noteClean(value) {
    return noteHasValue(value) ? String(value).trim() : "";
  }

  function noteLine(label, value) {
    const v = noteClean(value);
    if (!noteHasValue(v)) return "";
    return `${label}: ${v}`;
  }

  function boldClaim(text) {
    return String(text).replace(/(Great|Good|No) savings claim/g, "<strong>$&</strong>");
  }

  function noteSection(title, lines) {
    const filtered = lines.filter(item => noteHasValue(item));
    if (filtered.length === 0) return "";
    return `${title}\n${filtered.join("\n")}`;
  }

  function yesNo(value) {
    const v = noteClean(value).toLowerCase();
    if (v === "yes" || v === "true" || v === "on" || v === "1") return "Yes";
    if (v === "no" || v === "false" || v === "0") return "No";
    return noteClean(value);
  }

  function formatRecapEmailValue(value) {
    const v = noteClean(value).toLowerCase();
    if (v === "yes_mosaic") return "Yes - Mosaic";
    if (v === "yes_other") return "Yes - Other";
    if (v === "yes_mosaic_spanish") return "Yes - Mosaic Spanish";
    if (v === "yes_other_spanish") return "Yes - Other Spanish";
    if (v === "yes_everbright_tx_thsa") return "Yes - Everbright TX/THSA";
    if (v === "no") return "No";
    return noteClean(value);
  }

  function joinAddress(address, city, state, zip) {
    return [noteClean(address), noteClean(city), noteClean(state), noteClean(zip)]
      .filter(noteHasValue)
      .join(", ");
  }

  function lenderName(prefix) {
    const type = val(prefix + "_lender_type");
    if (type === "mosaic") return "Mosaic";
    if (type === "everbright") return "Everbright";
    if (type === "other") return val(prefix + "_other_lender") || "Other";

  }

  function isCombinedTwoLoanCase() {

  function shouldUseTwoForms() {

    show("property_damage_section", val("property_damage") === "yes");
    show("moving_explain_section", val("moving_selling_home") === "yes");
    show("information_needed_section", val("consult_completed") === "no");

    const thsaDisabled = val("thsa_not_applicable") === "yes";

      if (el("verbal_cancel_notice")) el("verbal_cancel_notice").value = "";
      if (el("seller_notice_cancel")) el("seller_notice_cancel").value = "";

  function calculateDealerFeeForLoan(prefix) {
    const rate = num(prefix + "_interest_rate");
    const loan = num(prefix + "_amount");
    const disclosed = val(prefix + "_dealer_fee_disclosed").toLowerCase();

    let dealerPercent = 0;
    let dealerBandLabel = 0;

    if (rate <= 2.9 && rate > 0) {
      dealerPercent = 0.30;
      dealerBandLabel = 30;
    } else if (rate <= 4.9 && rate > 0) {
      dealerPercent = 0.25;
      dealerBandLabel = 25;
    } else if (rate <= 5.9 && rate > 0) {
      dealerPercent = 0.20;
      dealerBandLabel = 20;
    } else if (rate <= 6.9 && rate > 0) {
      dealerPercent = 0.15;
      dealerBandLabel = 15;
    } else if (rate <= 8.9 && rate > 0) {
      dealerPercent = 0.10;
      dealerBandLabel = 10;
    }

    let amount = loan * dealerPercent;
    let explain = "Enter loan amount and interest rate to estimate dealer fee.";

    if (loan > 0 && rate > 0) {
      explain =
        `Based on rate ${rate.toFixed(2)}%, dealer fee band = ${dealerBandLabel}% → ` +
        `${money(loan)} × ${Math.round(dealerPercent * 100)}% = ${money(amount)}.`;

      if (disclosed === "yes") {
        explain += " Dealer fee disclosed → treated as $0 in damages.";
        amount = 0;
      }
    }

    return { amount, explain };
  }

  function calculateMosaicForLoan(prefix, dealerFeeAmt) {
    const lender = lenderName(prefix).toLowerCase();
    const rate = num(prefix + "_interest_rate");
    const loanTermY = num(prefix + "_term");

    let amount = 0;
    let explain = "Select lender to see if Mosaic interest damage applies.";

    if (lender === "mosaic" && dealerFeeAmt > 0 && rate > 0) {
      const P = dealerFeeAmt;
      const i = (rate / 100) / 12;
      const N = (loanTermY > 0 ? loanTermY * 12 : 300);

      if (i > 0) {
        const payment = P * (i * Math.pow(1 + i, N)) / (Math.pow(1 + i, N) - 1);
        const totalInterest = (payment * N) - P;
        const discRate = rate > 0 ? rate / 100 : 0.05;
        const years = loanTermY > 0 ? loanTermY : 25;
        const npv = totalInterest / Math.pow(1 + discRate, years);

        amount = Math.max(0, npv);
        explain =
          `Uses dealer fee as principal (${money(P)}), rate ${rate.toFixed(2)}% over ${years} years. ` +
          `Discounted Mosaic interest damage ≈ ${money(amount)}.`;
      }
    } else if (lender === "mosaic") {
      explain = "Mosaic lender selected, but dealer fee is $0 or rate missing, so interest damage = $0.";
    } else if (lender) {
      explain = "Mosaic interest damage only applies when lender is Mosaic.";
    }

    return { amount, explain };
  }

  function calculateWarrantyForLoan(loanKeyForDisplay) {
    if (!checked("installer_out_of_business")) {
      return { amount: 0, explain: "No warranty breach selected → $0 warranty damage." };
    }

    let yearsLost = 0;

    if (isCombinedTwoLoanCase() && val("same_warranty_for_both") === "no") {
      yearsLost = num(loanKeyForDisplay === "loan1" ? "loan1_years_warranty_lost" : "loan2_years_warranty_lost");
    } else {
      yearsLost = num("shared_years_warranty_lost");
    }

    let amount = 0;
    const max = 7500;
    let explain = "";

    if (yearsLost <= 1) {
      amount = 0;
      explain = "Installer out of business / not honoring warranty, but ≤ 1 year lost → $0 warranty damage.";
    } else if (yearsLost <= 5) {
      amount = 2000;
      explain = `Years of warranty lost = ${yearsLost} → tiered warranty damage = ${money(amount)}.`;
    } else if (yearsLost <= 10) {
      amount = 5000;
      explain = `Years of warranty lost = ${yearsLost} → tiered warranty damage = ${money(amount)}.`;
    } else {
      amount = max;
      explain = `Years of warranty lost = ${yearsLost} → max-tier warranty damage = ${money(amount)}.`;
    }

    return { amount, explain };
  }

    function calculateSharedEnergyDamage() {
      const method = val("savings_calc_method");
      const payingMore = val("paying_more_now").toLowerCase();
      const loanTermY = Math.max(num("loan1_term"), num("loan2_term"));
    
      let amount = 0;
      let explain = "";
    
      /*
       * Keep the existing "paying more" gate for the older methods.
       * Simple Production Math is allowed to calculate regardless,
       * because the calculation itself may prove there is no savings claim.
       */
      if (payingMore === "no" && method !== "simple_production") {
        return {
          amount: 0,
          explain: "No electricity bill damage: client reports paying less overall for electric + loan payment."
        };
      }
    
      if (method === "avg_pre_post") {
        const preBill = num("pre_solar_bill");
        const postBill = num("post_solar_bill");
        const savingsType = val("savings_value_type");
    
        if (preBill <= 0 || postBill <= 0 || loanTermY <= 0) {
          return {
            amount: 0,
            explain: "Enter pre-solar bill, post-solar bill, and loan term to calculate energy savings damage."
          };
        }
    
        if (savingsType === "percent") {
          const percentEntry = num("percent_of_bill");
    
          if (percentEntry <= 0) {
            return {
              amount: 0,
              explain: "Percent of bill selected. Enter a promised savings percentage."
            };
          }
    
          const prom = percentEntry / 100;
          const monthlyBase = postBill - (preBill * (1 - prom));
    
          amount = Math.max(0, monthlyBase * 12 * loanTermY);
    
          explain =
            `Percent method: Pre = ${money(preBill)}, Post = ${money(postBill)}, promised savings = ${percentEntry}%. ` +
            `Estimated energy savings damages ≈ ${money(amount)}.`;
    
          return { amount, explain };
        }
    
        if (savingsType === "dollar") {
          const promisedBill = num("promised_bill_amount");
    
          if (promisedBill <= 0) {
            return {
              amount: 0,
              explain: "Dollar Amount selected. Enter the promised post-solar bill amount."
            };
          }
    
          const monthlyBase = postBill - promisedBill;
    
          amount = Math.max(0, monthlyBase * 12 * loanTermY);
    
          explain =
            `Custom bill method: Post = ${money(postBill)}, promised post-solar bill = ${money(promisedBill)}. ` +
            `Estimated energy savings damages ≈ ${money(amount)}.`;
    
          return { amount, explain };
        }
    
        return {
          amount: 0,
          explain: "Choose whether to use Percent of bill (%) or Dollar Amount ($)."
        };
      }
    
      if (method === "solar_vs_usage") {
        const percentEntry = num("solar_percent_of_bill");
        const avgUsage = num("avg_usage_kwh");
        const pricePerKwh = num("price_per_kwh");
        const avgSolar = num("avg_solar_produced_kwh");
    
        if (percentEntry <= 0 || avgUsage <= 0 || pricePerKwh <= 0 || loanTermY <= 0) {
          return {
            amount: 0,
            explain: "Enter usage, solar produced, price per kWh, loan term, and promised savings %."
          };
        }
    
        const prom = percentEntry / 100;
        const kwhAfterSolar = avgUsage - avgSolar;
        const kwhPromisedOffset = avgUsage * (1 - prom);
        const monthlyKwhDelta = kwhAfterSolar - kwhPromisedOffset;
        const monthlyDollarDelta = monthlyKwhDelta * pricePerKwh;
    
        amount = Math.max(0, monthlyDollarDelta * 12 * loanTermY);
    
        explain =
          `Solar Production vs Usage method: Usage = ${avgUsage} kWh, Solar = ${avgSolar} kWh, price = ${money(pricePerKwh)}. ` +
          `Estimated energy savings damages ≈ ${money(amount)}.`;
    
        return { amount, explain };
      }
    
      if (method === "simple_production") {
        const annualProduction = num("estimated_annual_production_kwh");
        const monthlyLoanPayment = num("initial_solar_monthly_payment");
    
        if (annualProduction <= 0 || monthlyLoanPayment <= 0 || loanTermY <= 0) {
          return {
            amount: 0,
            explain: "Enter system estimated production, Initial Solar Monthly Payment, and loan term to calculate Simple Production Math."
          };
        }
    
        const annualProjectedSavings =
          annualProduction * SIMPLE_PRODUCTION_RATE_PER_KWH;
    
        const monthlyProjectedSavings =
          annualProjectedSavings / 12;
    
        /*
         * Raw Simple Math result.
         *
         * Example:
         * $275 payment - $4,000 projected monthly savings
         * = -$3,725
         */
        const rawMonthlyResult = Math.round(
          (monthlyLoanPayment - monthlyProjectedSavings) * 100
        ) / 100;
    
        /*
         * NEGATIVE:
         * Show the actual negative result to Sales,
         * but apply $0 to damages.
         */
        if (rawMonthlyResult < 0) {
          amount = 0;
    
          const displayText =
            `${money(rawMonthlyResult)} / month — No savings claim`;
    
          explain =
            `Simple Production Math: Estimated production = ${annualProduction} kWh/year × ${money(SIMPLE_PRODUCTION_RATE_PER_KWH)} = ${money(annualProjectedSavings)} yearly projected savings. ` +
            `Monthly projected savings = ${money(monthlyProjectedSavings)}. ` +
            `Initial Solar Monthly Payment = ${money(monthlyLoanPayment)}. ` +
            `Simple Math result = ${money(rawMonthlyResult)} per month. ` +
            `Because the result is negative, there is no savings claim and $0 is applied to total damages.`;
    
          return {
            amount,
            displayText,
            rawMonthlyResult,
            noSavingsClaim: true,
            explain
          };
        }
    
        /*
         * EXACTLY ZERO:
         * Show $0 — not "No savings claim".
         */
        if (rawMonthlyResult === 0) {
          amount = 0;
    
          explain =
            `Simple Production Math: Estimated production = ${annualProduction} kWh/year × ${money(SIMPLE_PRODUCTION_RATE_PER_KWH)} = ${money(annualProjectedSavings)} yearly projected savings. ` +
            `Monthly projected savings = ${money(monthlyProjectedSavings)}. ` +
            `Initial Solar Monthly Payment = ${money(monthlyLoanPayment)}. ` +
            `Simple Math result = $0.`;
    
          return {
            amount: 0,
            displayText: "$0",
            rawMonthlyResult: 0,
            noSavingsClaim: false,
            claimQuality: "Good savings claim",
            explain
          };
        }
    
        /*
         * POSITIVE:
         * Keep the existing CAT behavior:
         * monthly damages × 12 × loan term.
         */
        amount = rawMonthlyResult * 12 * loanTermY;
    
        explain =
          `Simple Production Math: Estimated production = ${annualProduction} kWh/year × ${money(SIMPLE_PRODUCTION_RATE_PER_KWH)} = ${money(annualProjectedSavings)} yearly projected savings. ` +
          `Monthly projected savings = ${money(monthlyProjectedSavings)}. ` +
          `Initial Solar Monthly Payment = ${money(monthlyLoanPayment)}. ` +
          `Monthly savings damage = ${money(rawMonthlyResult)}. ` +
          `${money(rawMonthlyResult)} × 12 months × ${loanTermY} years = ${money(amount)} estimated energy savings damages.`;
    
        return {
          amount,
          displayText: money(amount),
          rawMonthlyResult,
          noSavingsClaim: false,
          claimQuality: rawMonthlyResult <= 25
            ? "Good savings claim"
            : "Great savings claim",
          explain
        };
      }
    
      return {
        amount: 0,
        explain: "Select how you want to calculate promised savings."
      };
    }

  function calculateSharedInstallDamage() {
    let missingDamage = 0;
    let mfgDamage = 0;
    const lines = [];

    if (checked("issue_missing_battery")) {
      missingDamage += 12500;
      lines.push(`Battery / Powerwall missing: ${money(12500)}`);
    }
    if (checked("issue_battery_not_activated")) {
      missingDamage += 3500;
      lines.push(`Battery installed but not activated: ${money(3500)}`);
    }
    if (checked("issue_wrong_panels")) {
      missingDamage += 4000;
      lines.push(`Wrong wattage panels installed: ${money(4000)}`);
    }

    const missingPanels = num("missing_panels_count");
    if (missingPanels > 0) {
      const panelsAmt = missingPanels * 650;
      missingDamage += panelsAmt;
      lines.push(`Missing panels (${missingPanels} × ${money(650)}): ${money(panelsAmt)}`);
    }

    if (checked("issue_missing_surge")) {
      missingDamage += 1000;
      lines.push(`Missing System Surge Protector: ${money(1000)}`);
    }

    if (checked("issue_inverter_sun")) {
      mfgDamage += 2000;
      lines.push(`Inverter installed in direct sun: ${money(2000)}`);
    }

    const amount = missingDamage + mfgDamage;
    const explain = lines.length
      ? lines.join(" | ") + ` | Installation subtotal: ${money(amount)}.`
      : "No installation or component issues selected → $0 for this category.";

    return { amount, missingDamage, mfgDamage, explain };
  }

  function calculateRescission() {
    const thsaDisabled = val("thsa_not_applicable") === "yes";
    const sellerNotice = thsaDisabled ? "" : val("seller_notice_cancel");

    const unsafe = checked("issue_unsafe_wiring");
    const neverCompleted = checked("issue_never_completed");
    const noBuyback = checked("issue_no_buyback");

    const sellerMissingOrBlank =
      sellerNotice === "missing_form" ||
      sellerNotice === "blank_form";

    const rescission = unsafe || neverCompleted || noBuyback || sellerMissingOrBlank;

    let reason = "No rescission-level code or completion issues selected.";

    if (rescission) {
      const reasons = [];
      if (unsafe) reasons.push("Unsafe wiring / code violation");
      if (neverCompleted) reasons.push("System never installed / completed");
      if (noBuyback) reasons.push("No solar buyback plan available");
      if (sellerMissingOrBlank) reasons.push("Seller notice of cancellation missing or blank");
      reason = `Rescission Likely triggered by: ${reasons.join(", ")}.`;
    }

    return { rescission, reason };
  }

  function calculateStrength(total, combinedLoanAmount, rescission) {
    const sellerMissingOneOfFour =
      val("thsa_not_applicable") === "yes"
        ? false
        : val("seller_notice_cancel") === "missing_1_of_4";
    let installerYears = num("shared_years_warranty_lost");

    if (isCombinedTwoLoanCase() && val("same_warranty_for_both") === "no") {
      installerYears = Math.max(num("loan1_years_warranty_lost"), num("loan2_years_warranty_lost"));
    }

    let strength = "Not Strong Enough";
    let explain = "";

    if (rescission) {
      strength = "Rescission Likely";
      explain = "Case strength elevated because rescission-level issue is present.";
      return { strength, explain };
    }

    if (combinedLoanAmount > 0 && total > combinedLoanAmount * 0.60) {
      strength = "Strong";
    } else if (total > 20000) {
      strength = "Medium";
    } else if (total > 10000) {
      strength = "Weak";
    }

    if (checked("installer_out_of_business") && installerYears > 3) {
      strength = "Strong";
    }

    if (sellerMissingOneOfFour) {
      strength = "Strong";
    }

    if (combinedLoanAmount > 0) {
      const pct = (total / combinedLoanAmount) * 100;
      explain =
        `Total damages = ${money(total)} ≈ ${pct.toFixed(1)}% of loan amount (${money(combinedLoanAmount)}).`;
    } else {
      explain = "Enter a loan amount to compare total damages against loan size.";
    }

    return { strength, explain };
  }

  function calculateLoan(prefix) {
    const dealer = calculateDealerFeeForLoan(prefix);
    const mosaic = calculateMosaicForLoan(prefix, dealer.amount);
    const warranty = calculateWarrantyForLoan(prefix);
    const subtotal = dealer.amount + mosaic.amount + warranty.amount;

    return {
      dealer,
      mosaic,
      warranty,
      subtotal,
      lender: lenderName(prefix),
      amount: num(prefix + "_amount"),
      term: num(prefix + "_term")
    };
  }

  function updateSummary() {
    const loan1 = calculateLoan("loan1");
    const combined = isCombinedTwoLoanCase();
    const loan2 = combined ? calculateLoan("loan2") : null;

    const sharedEnergy = calculateSharedEnergyDamage();
    const sharedInstall = calculateSharedInstallDamage();
    const oopDamage = num("oop_costs");
    const oopExplain = oopDamage > 0
      ? `Client reported ${money(oopDamage)} in out-of-pocket costs.`
      : "No out-of-pocket costs entered → $0 for this category.";

    const rescissionObj = calculateRescission();

    const combinedLoanAmount = loan1.amount + (loan2 ? loan2.amount : 0);
    const total =
      loan1.subtotal +
      (loan2 ? loan2.subtotal : 0) +
      sharedEnergy.amount +
      oopDamage +
      sharedInstall.amount;

    const strengthObj = calculateStrength(total, combinedLoanAmount, rescissionObj.rescission);

    if (el("loan1_prevDealerFee")) el("loan1_prevDealerFee").textContent = money(loan1.dealer.amount);
    if (el("loan1_prevMosaicDamage")) el("loan1_prevMosaicDamage").textContent = money(loan1.mosaic.amount);
    if (el("loan1_prevWarrantyDamage")) el("loan1_prevWarrantyDamage").textContent = money(loan1.warranty.amount);
    if (el("loan1_prevSubtotal")) el("loan1_prevSubtotal").textContent = money(loan1.subtotal);

    if (loan2) {
      if (el("loan2_prevDealerFee")) el("loan2_prevDealerFee").textContent = money(loan2.dealer.amount);

      calc_loan1_subtotal: el("loan1_prevSubtotal") ? el("loan1_prevSubtotal").textContent : "$0",

      calc_loan2_dealer_fee_damage: el("loan2_prevDealerFee") ? el("loan2_prevDealerFee").textContent : "$0",
      calc_loan2_mosaic_interest_damage: el("loan2_prevMosaicDamage") ? el("loan2_prevMosaicDamage").textContent : "$0",
      calc_loan2_warranty_damage: el("loan2_prevWarrantyDamage") ? el("loan2_prevWarrantyDamage").textContent : "$0",
      calc_loan2_subtotal: el("loan2_prevSubtotal") ? el("loan2_prevSubtotal").textContent : "$0",

      calc_energy_damage: money(calculateSharedEnergyDamage().amount),
      calc_oop_damage: el("prevOOPDamage") ? el("prevOOPDamage").textContent : "$0",
      calc_install_damage: el("prevInstallDamage") ? el("prevInstallDamage").textContent : "$0",
      calc_total_damage: el("prevTotalDamage") ? el("prevTotalDamage").textContent : "$0",
      calc_rescission: el("prevRescission") ? el("prevRescission").textContent : "No",
      calc_case_strength: el("prevStrength") ? el("prevStrength").textContent : "Not Strong Enough",
      
      generated_note: buildCaseAssessmentNote(),
      explainer_dealer: el("detailDealer") ? el("detailDealer").textContent : "",
      explainer_mosaic: el("detailMosaic") ? el("detailMosaic").textContent : "",
      explainer_energy: el("detailEnergy") ? el("detailEnergy").textContent : "",
      explainer_warranty: el("detailWarranty") ? el("detailWarranty").textContent : "",
      explainer_oop: el("detailOOP") ? el("detailOOP").textContent : "",
      explainer_install: el("detailInstall") ? el("detailInstall").textContent : "",
      explainer_total: el("detailTotal") ? el("detailTotal").textContent : "",
      explainer_strength: el("detailStrength") ? el("detailStrength").textContent : ""
    };
  }

  function validateBeforeSubmit() {
    if (!val("first_name") || !val("last_name") || !val("phone")) {
      el("catv2_status").textContent = "Please complete first name, last name, and phone.";
      return false;
    }

    if (!val("loan1_amount") || !val("loan1_interest_rate") || !val("loan1_term")) {
      el("catv2_status").textContent = "Please complete the main Loan 1 calculator fields.";
      return false;
    }

    if (isCombinedTwoLoanCase()) {
      if (!val("loan2_amount") || !val("loan2_interest_rate") || !val("loan2_term")) {
        el("catv2_status").textContent = "Please complete the Loan 2 calculator fields for combined two-loan cases.";
        return false;
      }
    }

    if (!val("send_recap_email")) {
      el("catv2_status").textContent = "Please select whether to send a recap email.";
      return false;
    }

    return true;
  }

  function attachListeners() {
    const allInputs = document.querySelectorAll("#catv2-app input, #catv2-app select, #catv2-app textarea");
    allInputs.forEach(node => {
      const evt = node.tagName.toLowerCase() === "select" || node.type === "checkbox" ? "change" : "input";
      node.addEventListener(evt, function () {
        setupConditionalLogic();
        updateSummary();
      });
    });

    const submitBtn = el("catv2_submit_btn");
    if (submitBtn) {
      submitBtn.addEventListener("click", function () {
        setupConditionalLogic();
        updateSummary();

        if (!validateBeforeSubmit()) return;

        if (alreadySubmitted) {
          const confirmed = window.confirm(
            'This form has already been submitted once.\n\n' +
            'Are you sure you want to submit it again?\n\n' +
            'Before resubmitting, check "Send Recap Email" field and set it appropriately so the client does not receive a duplicate recap email.\n\n' +
            'If this new submission replaces the earlier one, remember to delete the unneeded note from the client’s account.'
          );

          if (!confirmed) {
            return;
          }
        }

        el("catv2_status").textContent = "Submitting...";

        fetch(WEBHOOK_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(buildPayload())
        })
        .then(() => {
          alreadySubmitted = true;
          el("catv2_status").textContent = "Submitted successfully! You may update the form and resubmit if needed.";
        })
        .catch(() => {
          el("catv2_status").textContent = "Error submitting form.";
        });
      });
    }
    
    const continueBtn = el("catv2_submit_and_continue");
    if (continueBtn) {
      continueBtn.addEventListener("click", function () {
        setupConditionalLogic();
        updateSummary();

        if (!validateBeforeSubmit()) return;

        if (alreadySubmitted) {
          const confirmed = window.confirm(
            'This form has already been submitted once.\n\n' +
            'Are you sure you want to submit it again and continue to the Deal Pitch form?\n\n' +
            'Before resubmitting, review the "Send Recap Email" field so the client does not receive a duplicate recap email.\n\n' +
            'If this new submission replaces the earlier one, remember to delete the unneeded note from the client’s account.'
          );

          if (!confirmed) {
            return;
          }
        }

        el("catv2_status").textContent = "Submitting...";

        fetch(WEBHOOK_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(buildPayload())
        })
        .then(() => {
          alreadySubmitted = true;
          window.location.href = buildDealPitchUrl();
        })
        .catch(() => {
          el("catv2_status").textContent = "Error submitting form.";
        });
      });
    }
  }

  function init() {
    prefillFromUrl();
    setupConditionalLogic();
    updateSummary();
    attachListeners();
  }

  let tries = 0;
  const maxTries = 40;
  const poller = setInterval(() => {
    tries++;
    if (el("catv2-app") && el("solarCalcPreview") && el("catv2_submit_btn")) {
      clearInterval(poller);
      init();
    }
    if (tries >= maxTries) {
      clearInterval(poller);
    }
  }, 250);
})();
</script>
